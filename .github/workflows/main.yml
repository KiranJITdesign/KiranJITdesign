name: Koi

# Redraws koi/koi.gif every night from the day that just ended.
# Embed it in README.md with:
#   <img src="koi/koi.gif" width="256" alt="My koi">

on:
  schedule:
    # 00:20 UTC, just after the day rolls over.
    - cron: "20 0 * * *"
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/koi.yml
      - koigen/**

permissions:
  contents: write

concurrency: koi

jobs:
  koi:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install the generator
        run: python -m pip install --quiet -r requirements.txt

      - name: Draw the koi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python -m koigen \
            --login "${{ github.repository_owner }}" \
            --body white \
            --out koi \
            --save-snapshot koi/snapshot.json \
            --print-summary

      - name: Commit the koi if it changed
        shell: bash
        run: |
          git add koi
          if git diff --cached --quiet; then
            echo "The koi is unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --quiet --message "koi: draw the day's koi"
          git push --quiet
